# Test every push and PR; on pushes to main, also build the image and roll the ECS service.
# Infra changes (infra/) are still applied by hand with `npx cdk deploy`.
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than cancelling a rollout mid-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC token for the AWS role
      contents: read
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: infra/deploy.sh
